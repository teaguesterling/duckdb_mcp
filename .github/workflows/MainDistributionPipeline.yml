#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-next-build:
    name: Build extension binaries (next)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: duckdb_mcp
      # next tracks duckdb main and is an expected-red forward-compat canary
      # (upstream API drift, e.g. Identifier). Windows left excluded here since
      # this leg can't be evaluated green anyway; Windows is re-enabled on the
      # stable leg below where it's meaningful.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5-variegata
      ci_tools_version: v1.5-variegata
      extension_name: duckdb_mcp

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: duckdb-stable-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb_mcp-v1.5-variegata-extension-linux_amd64
          path: build/release/extension/duckdb_mcp/

      - name: List extension files (debug)
        run: |
          echo "Contents of build/release/extension/duckdb_mcp/:"
          ls -la build/release/extension/duckdb_mcp/
          echo "Looking for extension file:"
          find build/release -name "*.duckdb_extension" -type f

      # No prebuilt DuckDB CLI release exists for the v1.5-variegata branch
      # tip, and the stable extension is built against that branch commit
      # (its embedded duckdb version = git-describe of the tip, e.g.
      # v1.5.4-N-g<sha>), so a tagged release CLI would fail the LOAD version
      # check. Build a matching CLI from the same branch source instead.
      - name: Build DuckDB CLI from v1.5-variegata source
        run: |
          cd duckdb
          git fetch --tags --force origin v1.5-variegata
          git checkout v1.5-variegata
          cd ..
          make -C duckdb release
          mkdir -p build/release
          cp duckdb/build/release/duckdb build/release/duckdb
          chmod +x build/release/duckdb
          ./build/release/duckdb --version

      - name: Run integration tests
        run: |
          chmod +x test/integration/run_integration_tests.sh
          ./test/integration/run_integration_tests.sh

      - name: Run HTTP transport tests
        run: |
          chmod +x test/http/test_http_transport.sh
          ./test/http/test_http_transport.sh
