#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-next-build:
    name: Build extension binaries (next)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: duckdb_mcp
      # Same cp1252 reporter crash as the v1.5.3 stable job (see below) —
      # duckdb's scripts/ci/run_tests.py emits U+274C ❌ on test-batch
      # failure and Windows' default cp1252 stdout can't encode it,
      # masking the actual test result. Excluded here too until upstream
      # sets PYTHONIOENCODING / utf8_mode on the mingw runner.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.3
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: duckdb_mcp
      # windows_amd64_mingw excluded on v1.5.3 stable: duckdb's
      # scripts/ci/run_tests.py prints a U+274C ❌ glyph on test-batch failure,
      # which Windows' default cp1252 stdout can't encode (UnicodeEncodeError),
      # masking the underlying test result. Affects every extension migrating
      # to v1.5.3 on this runner (see duckdb_urlpattern + duckdb_webbed
      # exclude lists); revisit once upstream sets PYTHONIOENCODING /
      # utf8_mode in the runner. windows_amd64 also excluded here because
      # duckdb_mcp's transitively-included fmt headers force MSVC into a
      # C++17-inline-variable path despite our PRIVATE /std:c++17 flag —
      # tracking separately.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: duckdb-stable-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb_mcp-v1.5.3-extension-linux_amd64
          path: build/release/extension/duckdb_mcp/

      - name: List extension files (debug)
        run: |
          echo "Contents of build/release/extension/duckdb_mcp/:"
          ls -la build/release/extension/duckdb_mcp/
          echo "Looking for extension file:"
          find build/release -name "*.duckdb_extension" -type f

      - name: Download DuckDB binary
        run: |
          mkdir -p build/release
          wget -q https://github.com/duckdb/duckdb/releases/download/v1.5.3/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip -d build/release/
          chmod +x build/release/duckdb

      - name: Run integration tests
        run: |
          chmod +x test/integration/run_integration_tests.sh
          ./test/integration/run_integration_tests.sh

      - name: Run HTTP transport tests
        run: |
          chmod +x test/http/test_http_transport.sh
          ./test/http/test_http_transport.sh
