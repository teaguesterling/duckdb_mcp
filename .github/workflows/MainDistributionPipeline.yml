#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Two things this key gets wrong if you write the obvious version, both of
  # which manufacture phantom red checks rather than real failures.
  #
  # 1. github.event_name is part of the key ON PURPOSE. Without it, a push to a
  #    branch and a workflow_dispatch on that same branch collide: same ref,
  #    same sha, both with empty head_ref/base_ref, so they hash to one group.
  #    cancel-in-progress then kills the push run every single time the canary
  #    is dispatched by hand -- and `gh pr checks` renders a CANCELLED job as
  #    `fail`, so the PR dashboard shows a wall of failures that never happened.
  #
  # 2. github.sha is deliberately NOT in the key. Including it for non-main refs
  #    (which is what this workflow used to do) gives every commit on a branch
  #    its own group, so cancel-in-progress can never supersede anything: rapid
  #    pushes pile up instead of replacing each other, and stale runs from
  #    superseded commits go on competing for the same runner quota as the
  #    current one. Leaving it out is what makes a new push cancel its own
  #    predecessor, which is the behaviour cancel-in-progress is for.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

jobs:
  # THE PIN EQUALS THE REGISTRY DEFAULT COMMIT, AND THE WORKFLOW SHIPS THE DEFAULT
  # AND THE VARIANT. Fleet rule (Teague, 2026-09-13): the duckdb submodule is
  # pinned at exactly the commit the community registry builds every extension
  # with by default (build.yml's duckdb_commit, built as its duckdb_version),
  # and this workflow also ships the v1.5 variant the registry still builds
  # (scripts/build.py's variegata route). Otherwise local builds and each repo's
  # own CI artifacts carry a different DuckDB than the served one, and extensions
  # built in different repos cannot co-load locally (the ABI is exact-version).
  # Measured 2026-09-13: five sibling repos were on a July dev commit, one on a
  # v1.5.6-dev commit, one on DuckDB main. Nothing but a check keeps this true.
  # The greps keep this job's constants from drifting away from the
  # `duckdb_commit:` / `duckdb_version:` / `ci_tools_version:` the build jobs below
  # actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    # Name kept as-is even though the rule is now "pin equals the registry default":
    # required-check configuration may key on this job name.
    runs-on: ubuntu-latest
    env:
      DUCKDB_COMMIT: d54cbbe3df17e8e5ce68312f483b4155836112aa
      # The version the build reports, passed as duckdb_version while duckdb_commit
      # selects the checkout. It must be a short release-shaped string: the
      # extension's metadata stamps at most 32 bytes of it, and DuckDB refuses to
      # load a file whose stamp differs from its own version, so a bare 40-char
      # commit as duckdb_version makes every `require duckdb_mcp` fail
      # (duckdb/community-extensions#3086).
      DUCKDB_VERSION: v2.0.0
      DUCKDB_CI_TOOLS: v2.0-cyanoptera
      DUCKDB_VARIANT: v1.5.6
      # Flip day (spec §3 step 3) keeps a duckdb-legacy-build at the outgoing version
      # for one release; set this to that version then so the stray-literal scan below
      # exempts it instead of flagging it. Empty the rest of the time.
      #
      # EMPTY at duckdb_mcp's flip: the outgoing version is v1.5.6, which is not
      # leaving -- it is DUCKDB_VARIANT above, built by duckdb-variegata-build and
      # already exempt from the scan. So there is no legacy job to exempt.
      DUCKDB_LEGACY: ''
      # DIVERGENCE FROM THE FLEET COPY (duck_tails #73), duckdb_mcp only: the next
      # leg pins the v2.0-cyanoptera tip as an explicit STAGED VERSION + COMMIT
      # pair (Teague, 2026-10-25), instead of the branch name. With the branch
      # name, ci-tools' prebuilt path (ci_phase.py prebuilt() at 2de8029) resolves
      # the staged version for the download URL only and never writes it back, so
      # the extension is stamped `v2.0-cyanoptera` against a library reporting
      # `v2.0.1-alpha50125` and nothing loads. Bump both together when the tip
      # moves; the version is the commit's
      # https://duckdb-staging.duckdb.org/<commit[:10]>/latest_alpha_version.txt
      # Both are exempt from the scans below, and are grepped like the others.
      DUCKDB_NEXT: v2.0.1-alpha50125
      DUCKDB_NEXT_COMMIT: bb5bdadda4ee51d39b359fe8f4d1960973191175
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the registry default commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One variable, one edit point: every sibling repo copies this job
          # verbatim, and the greps and the stray-literal scans below all read
          # this same file.
          wf=.github/workflows/MainDistributionPipeline.yml
          # The pin is compared with the commit directly rather than resolved
          # through ls-remote, so a moved tag cannot hide a stale pin.
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "registry default commit -> ${DUCKDB_COMMIT} (${DUCKDB_VERSION})"
          echo "submodule pin           -> ${have}"
          [ "$DUCKDB_COMMIT" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the registry default commit ${DUCKDB_COMMIT}; run: git -C duckdb fetch origin ${DUCKDB_CI_TOOLS} && git -C duckdb checkout ${DUCKDB_COMMIT}"; exit 1; }
          for want in "duckdb_commit: ${DUCKDB_COMMIT}" "duckdb_version: ${DUCKDB_VERSION}" "ci_tools_version: ${DUCKDB_CI_TOOLS}" "duckdb_version: ${DUCKDB_VARIANT}" "duckdb_version: ${DUCKDB_NEXT}" "duckdb_commit: ${DUCKDB_NEXT_COMMIT}"; do
            c=$(grep -c "${want}$" "$wf" || true)
            [ "$c" -ge 1 ] || { echo "::error::no build job in this workflow uses ${want}; this job's constants have drifted"; exit 1; }
          done
          # NO OTHER DuckDB VERSION may drift from the shipped ones anywhere else in
          # this file: sibling workflows (yaml, mcp) embed a version in artifact NAMES
          # and CLI download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the greps above cannot see, so
          # a bump left them stale and this job went green over a red build. Comment
          # lines (first non-space char `#`) are exempt, and so are `uses:` lines (a
          # `- uses:` list item too): a third-party action pin like `@v2.0.4` is not a
          # DuckDB version. Branch names like `v2.0-cyanoptera` and `v1.5-variegata`
          # have no third numeric component and so never match this pattern. The
          # optional pre-release suffix makes a `v2.0.0-alpha1`-style tag match whole, while
          # `v1.5.6-extension-wasm_eh` in an artifact name still reads as `v1.5.6`.
          # DUCKDB_LEGACY, when set (flip day, see above), is exempt too.
          ver_re='v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dev)[0-9.]*)?'
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            for v in $(printf '%s\n' "$line" | grep -oE "$ver_re" || true); do
              [ "$v" = "$DUCKDB_VERSION" ] && continue
              [ "$v" = "$DUCKDB_VARIANT" ] && continue
              [ "$v" = "$DUCKDB_NEXT" ] && continue
              [ -n "$DUCKDB_LEGACY" ] && [ "$v" = "$DUCKDB_LEGACY" ] && continue
              echo "::error::line ${lineno}: ${line} -- a DuckDB version literal that is not the shipped ${DUCKDB_VERSION} or ${DUCKDB_VARIANT}: derive it from the shipped version or bump it"
              bad=1
            done
          done < <(grep -nE "$ver_re" "$wf" || true)
          # The commit appears in duckdb_commit: inputs, which the version scan above
          # cannot see, so a commit bump could leave a stale sha behind. Any 40-hex
          # literal outside comments, `uses:` pins and `vcpkg_commit:` must be it.
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*vcpkg_commit:' && continue
            for h in $(printf '%s\n' "$line" | grep -oE '[0-9a-f]{40}' || true); do
              [ "$h" = "$DUCKDB_COMMIT" ] && continue
              [ "$h" = "$DUCKDB_NEXT_COMMIT" ] && continue
              echo "::error::line ${lineno}: ${line} -- a commit literal that is not the registry default ${DUCKDB_COMMIT}: derive it from the pinned commit or bump it"
              bad=1
            done
          done < <(grep -nE '[0-9a-f]{40}' "$wf" || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY is the registry's own files, not this job's constants: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetches
          # are not served from the branch cache. THREE degraded paths, deliberately
          # different: UNREACHABLE (curl itself failed, HTTP code 000) is the world
          # being unavailable -> a NOTE, and the summary says the registry assertions
          # were not made, with only the local-constant assertions above run; a
          # non-2xx HTTP code (e.g. a renamed/removed registry file) is this check
          # asking the world a well-formed question and getting told no -> a FAILURE
          # naming the code and URL (a bare `curl -sf` would have mistaken this for
          # UNREACHABLE and measured nothing); REACHABLE, 2xx, BUT UNPARSEABLE is this
          # check being wrong about the file's content -> also a FAILURE.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          # An Authorization: Bearer header with an EMPTY token is not "no header": GitHub
          # answers 401 to it, worse than sending no header at all (confirmed empirically).
          # An unauthenticated local run (no GITHUB_TOKEN, which the docs tell maintainers
          # to run) would then always miss sha resolution and fall back to the `main` REF
          # NAME, comparing against whatever the branch URL's cache happens to be serving --
          # the exact staleness this sha-resolution step exists to avoid. So the header is
          # added only when a token is actually present; CI always has one.
          auth=(); [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          sha=$(curl -sf "${auth[@]}" https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          url1="${base}/${sha:-main}/.github/workflows/build.yml"
          url2="${base}/${sha:-main}/scripts/build.py"
          f1=$(mktemp); f2=$(mktemp)
          # curl itself writes 000 to -w's %{http_code} when no HTTP response was
          # received at all (DNS failure, connection refused, timeout); `|| echo 000`
          # would DOUBLE that to "000000" (curl's own "000" plus the fallback's),
          # which then fails the equality check below and misreads UNREACHABLE as a
          # non-2xx code. `|| true` only stops `set -e` from killing the script on
          # curl's nonzero exit; the "000" already captured is curl's, unaltered.
          code1=$(curl -s -o "$f1" -w '%{http_code}' "$url1" || true)
          code2=$(curl -s -o "$f2" -w '%{http_code}' "$url2" || true)
          if [ "$code1" = "000" ] || [ "$code2" = "000" ]; then
            echo "::notice::could not reach the community registry; the pin was checked against the local constants only"
            mode="NOT checked against the registry (unreachable); local constants ${DUCKDB_COMMIT:0:10}/${DUCKDB_VERSION}/${DUCKDB_CI_TOOLS}/${DUCKDB_VARIANT} only"
          elif [ "${code1#2}" = "$code1" ]; then
            echo "::error::community registry returned HTTP ${code1} for ${url1}"
            echo "duckdb-pin: FAILED, registry returned ${code1} for ${url1}" >> "$summary"; exit 1
          elif [ "${code2#2}" = "$code2" ]; then
            echo "::error::community registry returned HTTP ${code2} for ${url2}"
            echo "duckdb-pin: FAILED, registry returned ${code2} for ${url2}" >> "$summary"; exit 1
          else
            # Commented-out lines are dropped first: build.yml keeps a disabled
            # `# duckdb_tag:` line, and parsing it would report a tag nothing builds.
            grep -v '^[[:space:]]*#' "$f1" > "$f1.live" || true
            reg_commit=$(grep -m1 -o "inputs.duckdb_commit || (inputs.duckdb_version == '' && '[0-9a-f]\{40\}'" "$f1.live" | grep -o '[0-9a-f]\{40\}' || true)
            reg_version=$(grep -m1 -oE "^[[:space:]]+duckdb_version: \\$\\{\\{ inputs.duckdb_version \\|\\| 'v[^']*'" "$f1.live" | grep -o "'v[^']*'" | tr -d "'" || true)
            reg_tools=$(grep -m1 -o "inputs.ci_tools_version || '[^']*'" "$f1.live" | grep -o "'[^']*'$" | tr -d "'" || true)
            # build.py routes one DUCKDB_VERSION to each descriptor's `variegata` ref;
            # the version sits in the condition on the line before.
            reg_variant=$(grep -B1 "'variegata' in desc" "$f2" | grep -m1 -o "== 'v[0-9.]*'" | grep -o "v[0-9.]*" || true)
            if [ -z "$reg_commit" ] || [ -z "$reg_version" ] || [ -z "$reg_tools" ] || [ -z "$reg_variant" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build.py carry no recognisable default (commit='${reg_commit}', version='${reg_version}', ci-tools='${reg_tools}', variant='${reg_variant}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            registry="${reg_commit}/${reg_version}/${reg_tools}/${reg_variant}"
            repo="${DUCKDB_COMMIT}/${DUCKDB_VERSION}/${DUCKDB_CI_TOOLS}/${DUCKDB_VARIANT}"
            if [ "$registry" != "$repo" ]; then
              echo "::error::the community registry builds commit/version/ci-tools/variant ${registry} (at ${sha:-main}) but this repo ships ${repo}; update the pin, the constants and the build jobs to the registry's lines"
              echo "duckdb-pin: FAILED, registry ${registry} vs repo ${repo}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (default ${reg_commit:0:10} ${reg_version} on ${reg_tools}, variant ${reg_variant}, at ${sha:-main})"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_COMMIT:0:10} (${DUCKDB_VERSION}); jobs ship it and ${DUCKDB_VARIANT}; ${mode}" | tee -a "$summary"

  format-safety:
    name: Formatting safety (#82, #85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pinned to the version DuckDB formats with; a different major version
      # would report drift that `make format-fix` locally would not reproduce.
      - name: Install clang-format 11
        run: pip install 'clang_format==11.0.1'
      - name: Run formatting safety tests
        run: |
          chmod +x test/format/test_format_safety.sh
          ./test/format/test_format_safety.sh

  # THE NEXT LINE, first-class -- NOT a canary and NOT advisory, whatever this
  # job used to be called. The name said "Canary -- build against DuckDB main
  # (advisory)" from fb485a0 until this commit, and by then it was wrong twice
  # over:
  #
  #   fb485a0  named it a DuckDB-main canary and gated it to main + dispatch;
  #            at that point it really did build `main`.
  #   8bcb10c  moved its target off `main` onto the 2.0 release branch.
  #   008c5d8  Teague's dual-line ruling (2026-09-13) put `pull_request` back in
  #            the gate on purpose, making the next line a PR gate -- and left
  #            the name alone.
  #
  # So for a month this job built v2.0-cyanoptera, blocked PRs by design, and
  # advertised itself as an advisory build of a line nobody ships. A red
  # required gate that calls itself advisory is worse than either one honestly
  # labelled: it invites the reader to gate it off PRs, which would drop the
  # coverage below and leave the regression to be found by the registry.
  #
  # WHY IT IS A GATE. The community registry's descriptor for this extension
  # sets `ref_next == ref` deliberately, so the registry builds and TESTS the
  # shipped release against v2.0-cyanoptera (v2.3.1 shipped unvalidated on 2.0;
  # #91 is the fix that made ref_next == ref worth setting). This job is the
  # only place that build happens before the registry does it. If it is red,
  # the release is broken on the line the registry serves it on, and the PR
  # should be red.
  #
  # The gate is byte-identical to duck_block_utils' duckdb-next-build and runs
  # it ONCE per PR, not twice: a push to a PR branch fires both a push run and a
  # pull_request run for the same commit. Runs on PRs, on push to main, and on
  # dispatch. `if:` rather than `continue-on-error:` because a job calling a
  # REUSABLE workflow accepts only a fixed set of keys -- and nothing here wants
  # continue-on-error anyway, which is the point of the rename.
  #
  # The advisory DuckDB-main canary that the old name described does not exist
  # in this repo. duck_block_utils carries one as a separate duckdb-main-canary
  # job gated to dispatch + push-to-main; this repo has no job building `main`.
  duckdb-next-build:
    name: Build extension binaries (duckdb next, v2.0 line)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      # The DUCKDB_NEXT pair from the duckdb-pin job; see the note there.
      duckdb_version: v2.0.1-alpha50125
      duckdb_commit: bb5bdadda4ee51d39b359fe8f4d1960973191175
      ci_tools_version: main
      extension_name: duckdb_mcp
      # KEPT AS-IS, and its old justification is void. The exclusion was argued
      # from "this leg can't be evaluated green anyway" -- true of an
      # expected-red canary, false of a gate. Windows is green on the stable leg
      # below, and whether it builds on v2.0 has NOT been measured; widening the
      # matrix here is a separate change that could add newly-red legs, so it is
      # left for a deliberate measurement rather than smuggled into a rename.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # hands run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var wins)
      # and test_env_variables reaches `make test_release` via ci_phase.py.
      # `--require duckdb_mcp` turns "could not load" into `require duckdb_mcp: FAILED`
      # instead of a silent skip. Verified on ci-tools main against b15358c371d:
      # present -> exit 0 "16 passed, 2 skipped"; hidden -> exit 2 "0 passed, 18 failed".
      # Needs a ci_tools_version that HAS `T` (main / v2.0-cyanoptera); on
      # v1.5-variegata the variable is silently ignored -- hence `make test-require`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require duckdb_mcp\" \"test/*\""}}'
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      # Build against the v2.0.0 release tag, which is also the submodule pin:
      # ci-tools' set_duckdb_version does `git checkout v2.0.0` before building,
      # so the produced extension is a proper loadable release binary (a
      # branch-tip -dev build is not loadable in released DuckDB). `.gitmodules
      # branch = v2.0-cyanoptera` keeps `submodule update --remote` on the 2.0.x
      # line for local dev. Windows stays IN this leg: the registry builds it.
      # duckdb_commit selects the checkout; duckdb_version is the label it reports
      # (see DUCKDB_VERSION in the duckdb-pin job).
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: duckdb_mcp
      # Same guard as duckdb-next-build, for the same reason: on 2.0 an
      # unloadable extension otherwise skips every test and reports green.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require duckdb_mcp\" \"test/*\""}}'

  # THE v1.5 VARIANT the registry still builds (scripts/build.py's variegata
  # route; DUCKDB_VARIANT in the duckdb-pin job). Gating for as long as the
  # registry builds it. The descriptor sets no `variegata` key, so the registry
  # builds the same `ref` for v1.5.6 users, and this is the only pre-registry
  # check that a release still builds and tests on 1.5.6. `require` is inert on
  # this line (see `make test-require`), so it carries no test_config.
  duckdb-variegata-build:
    name: Build extension binaries (DuckDB v1.5 variant)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: duckdb_mcp

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: duckdb-stable-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb_mcp-v2.0.0-extension-linux_amd64
          path: build/release/extension/duckdb_mcp/

      - name: List extension files (debug)
        run: |
          echo "Contents of build/release/extension/duckdb_mcp/:"
          ls -la build/release/extension/duckdb_mcp/
          echo "Looking for extension file:"
          find build/release -name "*.duckdb_extension" -type f

      - name: Download DuckDB binary
        run: |
          mkdir -p build/release
          # v2.0 renamed the asset and switched it from .zip to .tar.gz.
          wget -q https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          tar xzf duckdb-cli-linux-amd64.tar.gz -C build/release/
          chmod +x build/release/duckdb

      - name: Run integration tests
        run: |
          chmod +x test/integration/run_integration_tests.sh
          ./test/integration/run_integration_tests.sh

      - name: Run HTTP transport tests
        run: |
          chmod +x test/http/test_http_transport.sh
          ./test/http/test_http_transport.sh

      # Guards the stdio protocol stream against stray writes to fd 1 (issue #74).
      # The failure this catches is silent — a successful response is dropped by the
      # peer rather than an error being raised — so it has to be asserted explicitly.
      - name: Run stdio stdout hygiene tests
        run: |
          chmod +x test/stdio/test_stdio_stdout_hygiene.sh
          ./test/stdio/test_stdio_stdout_hygiene.sh
